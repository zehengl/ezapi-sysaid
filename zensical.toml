[project]
nav = [
  { "Home" = "index.md" },
  { "Endpoints" = [
    "endpoints/index.md",
    { "Action Items" = "endpoints/action_items.md" },
    { "Add-Ons" = "endpoints/add_ons.md" },
    { "Filters" = "endpoints/filters.md" },
    { "Service Requests" = "endpoints/service_requests.md" },
    { "Users" = "endpoints/users.md" },
  ] },
]
site_name = "ezapi-sysaid"
site_author = "Zeheng Li"
repo_name = "ezapi-sysaid"
repo_url = "https://github.com/zehengl/ezapi-sysaid"

[project.plugins.minify]
minify_html = true
minify_css = true

[project.plugins.git-revision-date-localized]
type = "timeago"
enable_creation_date = true

[project.theme]
variant = "classic"
favicon = "https://raw.githubusercontent.com/zehengl/ezapi-sysaid/main/logo.png"
logo = "https://raw.githubusercontent.com/zehengl/ezapi-sysaid/main/logo.png"
font.text = "Roboto"
features = [
  "header.autohide",
  "content.code.copy",
  "navigation.top",
  "navigation.footer",
  "navigation.tabs",
  "navigation.indexes",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "green"
accent = "green"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "light green"
accent = "light green"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.details = {}

[project.extra]
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/zehengl" },
  { icon = "fontawesome/brands/linkedin", link = "https://linkedin.com/in/zehengl" },
]
